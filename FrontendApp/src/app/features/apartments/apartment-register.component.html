
<main class="container py-4">
  @if (step === 1) {
    <h2 class="mb-4">Características generales de los apartamentos</h2>
    <div class="row mb-4">
      <div class="col-md-3 mb-3">
        <label for="apartmentsPerFloor" class="form-label">Nº de apartamentos por piso</label>
        <input id="apartmentsPerFloor" type="number" min="1" class="form-control" [(ngModel)]="apartmentsPerFloor" />
      </div>
      <div class="col-md-3 mb-3">
        <label for="area" class="form-label">Superficie (m²)</label>
        <input id="area" type="text" class="form-control" [(ngModel)]="area" placeholder="70 m^2" />
      </div>
      <div class="col-md-3 mb-3">
        <label for="numRooms" class="form-label">Nº de habitaciones</label>
        <input id="numRooms" type="number" min="1" class="form-control" [(ngModel)]="numRooms" />
      </div>
      <div class="col-md-3 mb-3">
        <label for="numBathrooms" class="form-label">Nº de baños</label>
        <input id="numBathrooms" type="number" min="1" class="form-control" [(ngModel)]="numBathrooms" />
      </div>
    </div>
  }

  <div class="d-flex justify-content-between mb-4" *ngIf="step === 1">
    <button type="button" class="btn btn-lg px-5 shadow rounded-3 fw-semibold"
      style="background-color: var(--color-primary-dark); color: var(--color-white); border: 2px solid var(--color-primary); transition: background 0.2s, color 0.2s;"
      onmouseover="this.style.backgroundColor='var(--color-primary)'"
      onmouseout="this.style.backgroundColor='var(--color-primary-dark)'"
      (click)="confirmGeneralCharacteristics()">
      Registro detallado
    </button>
    <button type="button" class="btn btn-lg px-5 shadow rounded-3 fw-semibold"
      style="background-color: var(--color-primary-dark); color: var(--color-white); border: 2px solid var(--color-primary); transition: background 0.2s, color 0.2s;"
      onmouseover="this.style.backgroundColor='var(--color-primary)'"
      onmouseout="this.style.backgroundColor='var(--color-primary-dark)'"
      (click)="finishRegistration()"
      [disabled]="isCreatingApartments">
      @if (isCreatingApartments) {
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Creando apartamentos...
      } @else {
        Finalizar registro
      }
    </button>
  </div>

  @if (step === 2) {
    <h4 class="mb-3">Piso {{ currentFloor }}</h4>
    <div class="row">
  @for (apt of apartmentsByFloor[getCurrentFloorId()]; track apt; let i = $index) {
        <div class="col-md-4 mb-3">
          <div class="card p-3">
            <strong>Apartamento</strong>
            <div class="mb-2">
              <label>Puerta:</label>
              <input class="form-control" [(ngModel)]="apt.door" />
            </div>
            <div class="mb-2">
              <label>Habitaciones:</label>
              <input type="number" min="1" class="form-control" [(ngModel)]="apt.numRooms" />
            </div>
            <div class="mb-2">
              <label>Baños:</label>
              <input type="number" min="1" class="form-control" [(ngModel)]="apt.numBathrooms" />
            </div>
            <div class="mb-2">
              <label>Superficie (m²):</label>
              <input type="number" min="1" class="form-control" [(ngModel)]="apt.area" />
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <button class="btn btn-danger btn-sm" (click)="removeApartment(getCurrentFloorId(), i)">Eliminar</button>
            </div>
          </div>
        </div>
      }
      <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="floors.indexOf(currentFloor) === 0">
          <button class="page-link" (click)="goToFloor(floors[0])">Primera</button>
        </li>
        <li class="page-item" [class.disabled]="floors.indexOf(currentFloor) === 0">
          <button class="page-link" (click)="prevFloor()">Anterior</button>
        </li>
        @for (floor of floors; track floor; let i = $index) {
          <li class="page-item" [class.active]="currentFloor === floor">
            <button class="page-link" (click)="goToFloor(floor)">Piso {{ floor }}</button>
          </li>
        }
        <li class="page-item" [class.disabled]="floors.indexOf(currentFloor) === floors.length - 1">
          <button class="page-link" (click)="nextFloor()">Siguiente</button>
        </li>
        <li class="page-item" [class.disabled]="floors.indexOf(currentFloor) === floors.length - 1">
          <button class="page-link" (click)="goToFloor(floors[floors.length-1])">Última</button>
        </li>
      </ul>
    </nav>
      <div class="col-12 mt-2">
        <button class="btn btn-primary" (click)="addApartment(getCurrentFloorId())">Añadir nuevo apartamento</button>
      </div>
    </div>
    <button class="btn btn-secondary mt-3" (click)="step = 1">Volver</button>
  }
</main>
