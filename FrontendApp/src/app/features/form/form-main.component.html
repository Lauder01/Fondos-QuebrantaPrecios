<div class="bg-body-tertiary min-vh-100 py-4">
	<div class="container d-flex flex-column align-items-center">
		<div class="text-center mb-4" style="width:100%;">
			<i class="bi bi-buildings fs-1 text-primary"></i>
			<h1 class="fw-bold mt-2">Registro de Edificios</h1>
			<p class="lead text-secondary">Complete la información del edificio para registrarlo en el sistema</p>
		</div>
		<form [formGroup]="form" (ngSubmit)="onSubmit()" style="max-width:70%;min-width:320px;width:100%;margin:auto;">
			<div class="row g-4">
				<div class="col-12">
					<div class="card shadow-sm border-0 rounded-4 mb-4">
						<div class="card-body p-4">
							<div class="d-flex align-items-center mb-2">
								<i class="bi bi-person-lines-fill fs-4 text-primary me-2"></i>
								<h3 class="fw-bold mb-0">Información General</h3>
							</div>
							<div class="text-secondary mb-4" style="margin-top:-8px;">Datos básicos del edificio y empresa constructora</div>
							<app-general-info [formGroup]="generalInfoGroup"></app-general-info>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="card shadow-sm border-0 rounded-4 mb-4">
						<div class="card-body p-4">
							<div class="d-flex align-items-center mb-2">
								<i class="bi bi-geo-alt-fill fs-4 text-primary me-2"></i>
								<h3 class="fw-bold mb-0">Ubicación</h3>
							</div>
							<div class="text-secondary mb-4" style="margin-top:-8px;">Dirección completa del edificio</div>
							<app-location [formGroup]="locationGroup"></app-location>
						</div>
					</div>
				</div>
				<div class="col-12">
					<div class="card shadow-sm border-0 rounded-4 mb-4">
						<div class="card-body p-4">
							<div class="d-flex align-items-center mb-2">
								<i class="bi bi-tools fs-4 text-primary me-2"></i>
								<h3 class="fw-bold mb-0">Detalles Técnicos</h3>
							</div>
							<div class="text-secondary mb-4" style="margin-top:-8px;">Características físicas y técnicas del edificio</div>
							<app-technical-details [formGroup]="technicalDetailsGroup"></app-technical-details>
						</div>
					</div>
				</div>
			</div>
			<div class="text-center mt-4">
				<button type="submit" class="btn btn-primary btn-lg px-5 shadow rounded-3">
					Registrar Edificio
				</button>
			</div>
		</form>
	</div>
</div>
