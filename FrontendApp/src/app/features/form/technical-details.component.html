<div [formGroup]="formGroup">
	<div class="row g-2">
		<div class="col-md-3">
			<label class="form-label fw-semibold small text-primary-dark">Número de Plantas</label>
			<input type="number" class="form-control form-control-sm" formControlName="floorCount" placeholder="1">
		</div>
		<div class="col-md-3">
			<label class="form-label fw-semibold small text-primary-dark"><i class="bi bi-calendar me-1 text-primary-dark"></i> Año de Construcción</label>
			<input type="number" class="form-control form-control-sm" formControlName="yearBuilt" placeholder="2025">
		</div>
		<div class="col-md-3">
			<label class="form-label fw-semibold small text-primary-dark">€ Precio (€)</label>
			<input type="number" class="form-control form-control-sm" formControlName="price" placeholder="0">
		</div>
		<div class="col-md-3">
			<label class="form-label fw-semibold small text-primary-dark">Apartamentos por Planta</label>
			<input type="number" class="form-control form-control-sm" placeholder="1">
		</div>
		<div class="col-12">
			<div class="form-check mt-1">
				<input class="form-check-input" type="checkbox" id="hasElevator">
				<label class="form-check-label fw-semibold small" for="hasElevator">
					El edificio tiene ascensor
				</label>
				<div class="form-text ms-1 small">Marque esta opción si el edificio cuenta con ascensor</div>
			</div>
		</div>
		<div class="col-md-4">
			<label class="form-label fw-semibold small text-primary-dark" for="apartmentsPerFloor">Nº de apartamentos por planta</label>
			<input id="apartmentsPerFloor" type="number" class="form-control form-control-sm" formControlName="apartmentsPerFloor" placeholder="4"
				[ngClass]="{'is-invalid': formGroup.get('apartmentsPerFloor')?.invalid && formGroup.get('apartmentsPerFloor')?.touched, 'is-valid': formGroup.get('apartmentsPerFloor')?.valid && formGroup.get('apartmentsPerFloor')?.touched}">
			<div *ngIf="formGroup.get('apartmentsPerFloor')?.invalid && formGroup.get('apartmentsPerFloor')?.touched" class="invalid-feedback d-block small">
				Debe indicar un número válido de apartamentos por planta.
			</div>
		</div>
		<div class="col-md-4">
			<label class="form-label fw-semibold small text-primary-dark" for="hasElevator">¿Tiene ascensor?</label>
			<div class="form-check form-switch mt-1">
				<input class="form-check-input" type="checkbox" formControlName="hasElevator" id="hasElevator">
				<label class="form-check-label small" for="hasElevator">Sí</label>
			</div>
		</div>
	</div>
</div>
