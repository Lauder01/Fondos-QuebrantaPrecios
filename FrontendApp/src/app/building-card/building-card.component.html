
<div
  class="card building-card-full shadow-sm border-0 rounded-4 h-100"
  (click)="goToDetail()"
  style="cursor:pointer"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Ver detalles de ' + building.name"
>
  <img
    [src]="building.coverImageUrl"
    [alt]="building.name"
    class="building-bg-image"
    (error)="onImageError($event)"
    loading="lazy"
  />
  <div class="card-info-overlay d-flex flex-column justify-content-end">
    <div class="info-content high-contrast">
      <h6 class="card-title text-primary mb-2">{{ building.name }}</h6>
      @if (shouldShowAddress()) {
        <div class="mb-2">
          Dirección: {{ building.constructedAddress }}
        </div>
      }
      <div class="mb-2">
        {{ building.name }}
      </div>
      <div class="card-footer-custom d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
        <div class="fw-semibold text-success">
          {{ building.price | currency:'EUR' }}
        </div>
        <div [class]="getStatusBadgeClass()">
          {{ building.statusName || 'Sin estado' }}
        </div>
      </div>
    </div>
  </div>
</div>
