<div class="card shadow-sm mb-4">
	<div class="card-body">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2 class="card-title mb-0">Listado de Edificios</h2>
			<button class="btn btn-outline-primary btn-sm" (click)="toggleMap()">
				<i class="bi bi-geo-alt me-1"></i>
				{{ showMap ? 'Ocultar' : 'Mostrar' }} Mapa
			</button>
		</div>

		<div class="mb-3">
			<input
				type="text"
				class="form-control"
				placeholder="Buscar por nombre de edificio..."
				[(ngModel)]="searchName"
				(input)="onSearchChange()"
			/>
		</div>
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div class="d-flex align-items-center" style="max-width: 300px;">
				<label for="pageSizeSelect" class="form-label me-2 mb-0">Edificios por página:</label>
				<select id="pageSizeSelect" class="form-select w-auto" [(ngModel)]="pageSize" (change)="onPageSizeChange()">
					<option value="3">3</option>
					<option value="6">6</option>
					<option value="9">9</option>
					<option value="12">12</option>
				</select>
			</div>
			
			<!-- Paginación superior -->
			<nav *ngIf="totalPages > 1 && !loading" class="d-none d-md-block">
				<ul class="pagination pagination-sm mb-0">
					<li class="page-item" [class.disabled]="page === 1">
						<button class="page-link pagination-theme-btn" (click)="goToPage(1)" [disabled]="page === 1">Primera</button>
					</li>
					<li class="page-item" [class.disabled]="page === 1">
						<button class="page-link pagination-theme-btn" (click)="goToPage(page - 1)" [disabled]="page === 1">Anterior</button>
					</li>
					<li class="page-item" *ngFor="let p of getPagesArray()" [class.active]="p === page">
						<button class="page-link pagination-theme-btn pagination-num-btn" (click)="goToPage(p)">{{ p }}</button>
					</li>
					<li class="page-item" [class.disabled]="page === totalPages">
						<button class="page-link pagination-theme-btn" (click)="goToPage(page + 1)" [disabled]="page === totalPages">Siguiente</button>
					</li>
					<li class="page-item" [class.disabled]="page === totalPages">
						<button class="page-link pagination-theme-btn" (click)="goToPage(totalPages)" [disabled]="page === totalPages">Última</button>
					</li>
				</ul>
			</nav>
		</div>

		<!-- Mapa de ubicaciones -->
		<div *ngIf="showMap && !loading" class="mb-4">
			<div class="card">
				<div class="card-header bg-light">
					<h5 class="mb-0">
						<i class="bi bi-geo-alt-fill me-2 text-primary"></i>
						Ubicaciones de Edificios
					</h5>
				</div>
				<div class="card-body p-0">
					<app-map
						#mapComponent
						[locations]="mapLocations"
						height="400px"
						[centerLat]="40.4168"
						[centerLng]="-3.7038"
						[zoom]="10">
					</app-map>
				</div>
			</div>
		</div>

		<div *ngIf="loading" class="text-center my-4">
			<div class="spinner-border text-primary" role="status">
				<span class="visually-hidden">Cargando...</span>
			</div>
		</div>

		<div class="row mt-2" *ngIf="!loading">
			<div class="col-md-4 mb-3" *ngFor="let building of buildings; trackBy: trackByBuildingId">
				<app-building-card [building]="building"></app-building-card>
			</div>
			<div *ngIf="buildings.length === 0" class="text-center text-muted py-4">
				No se encontraron edificios.
			</div>
		</div>

		<nav *ngIf="totalPages > 1 && !loading" class="mt-4">
			 <ul class="pagination justify-content-center">
							<li class="page-item" [class.disabled]="page === 1">
									<button class="page-link pagination-theme-btn" (click)="goToPage(1)" [disabled]="page === 1">Primera</button>
							</li>
							<li class="page-item" [class.disabled]="page === 1">
									<button class="page-link pagination-theme-btn" (click)="goToPage(page - 1)" [disabled]="page === 1">Anterior</button>
							</li>
							  <li class="page-item" *ngFor="let p of getPagesArray()" [class.active]="p === page">
								  <button class="page-link pagination-theme-btn pagination-num-btn" (click)="goToPage(p)">{{ p }}</button>
							  </li>
							<li class="page-item" [class.disabled]="page === totalPages">
									<button class="page-link pagination-theme-btn" (click)="goToPage(page + 1)" [disabled]="page === totalPages">Siguiente</button>
							</li>
							<li class="page-item" [class.disabled]="page === totalPages">
									<button class="page-link pagination-theme-btn" (click)="goToPage(totalPages)" [disabled]="page === totalPages">Última</button>
							</li>
			 </ul>
		</nav>
	</div>
</div>
