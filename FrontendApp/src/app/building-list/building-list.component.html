<div class="card shadow-sm mb-4">
	<div class="card-body">
		<div class="mb-3">
			<input
				type="text"
				class="form-control"
				placeholder="Buscar por nombre de edificio..."
				[(ngModel)]="searchName"
				(input)="onSearchChange()"
			/>
		</div>
		<div class="d-flex align-items-center mb-4" style="max-width: 300px;">
			<label for="pageSizeSelect" class="form-label me-2 mb-0">Edificios por página:</label>
			<select id="pageSizeSelect" class="form-select w-auto" [(ngModel)]="pageSize" (change)="onPageSizeChange()">
				<option value="3">3</option>
				<option value="6">6</option>
				<option value="9">9</option>
				<option value="12">12</option>
			</select>
		</div>

		<div *ngIf="loading" class="text-center my-4">
			<div class="spinner-border text-primary" role="status">
				<span class="visually-hidden">Cargando...</span>
			</div>
		</div>

		<div class="row mt-2" *ngIf="!loading">
			<div class="col-md-4 mb-3" *ngFor="let building of buildings; trackBy: trackByBuildingId">
				<app-building-card [building]="building"></app-building-card>
			</div>
			<div *ngIf="buildings.length === 0" class="text-center text-muted py-4">
				No se encontraron edificios.
			</div>
		</div>

		<nav *ngIf="totalPages > 1 && !loading" class="mt-4">
			 <ul class="pagination justify-content-center">
							<li class="page-item" [class.disabled]="page === 1">
									<button class="page-link pagination-theme-btn" (click)="goToPage(1)" [disabled]="page === 1">Primera</button>
							</li>
							<li class="page-item" [class.disabled]="page === 1">
									<button class="page-link pagination-theme-btn" (click)="goToPage(page - 1)" [disabled]="page === 1">Anterior</button>
							</li>
							  <li class="page-item" *ngFor="let p of getPagesArray()" [class.active]="p === page">
								  <button class="page-link pagination-theme-btn pagination-num-btn" (click)="goToPage(p)">{{ p }}</button>
							  </li>
							<li class="page-item" [class.disabled]="page === totalPages">
									<button class="page-link pagination-theme-btn" (click)="goToPage(page + 1)" [disabled]="page === totalPages">Siguiente</button>
							</li>
							<li class="page-item" [class.disabled]="page === totalPages">
									<button class="page-link pagination-theme-btn" (click)="goToPage(totalPages)" [disabled]="page === totalPages">Última</button>
							</li>
			 </ul>
		</nav>
		<style>
		.pagination-theme-btn {
			background-color: var(--color-primary-dark) !important;
			color: var(--color-white, #fff) !important;
			border: 1px solid var(--color-primary) !important;
			transition: background 0.2s, color 0.2s;
		}
		.pagination-theme-btn:disabled,
		.page-item.disabled .pagination-theme-btn {
			background-color: var(--color-primary-lightest) !important;
			color: #aaa !important;
			border: 1px solid var(--color-primary-light) !important;
		}
		/* Números de página: fondo blanco, número verde */
		/* Números de página: fondo verde clarito, número verde principal */
		.pagination-num-btn {
			background-color: var(--color-primary-light) !important;
			color: var(--color-primary) !important;
			border: 1px solid var(--color-primary) !important;
		}
		/* Página activa: fondo verde, número blanco */
		.page-item.active .pagination-num-btn {
			background-color: var(--color-primary) !important;
			color: #fff !important;
			border: 1px solid var(--color-primary-dark) !important;
		}
		</style>
	</div>
</div>
