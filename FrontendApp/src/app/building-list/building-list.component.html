<div class="card shadow-sm mb-4">
	<div class="card-body">
		<div class="mb-3">
			<input
				type="text"
				class="form-control"
				placeholder="Buscar por nombre de edificio..."
				[(ngModel)]="searchName"
				(ngModelChange)="onSearchChange()"
			/>
		</div>
		<div class="d-flex align-items-center mb-4" style="max-width: 300px;">
			<label for="pageSizeSelect" class="form-label me-2 mb-0">Edificios por página:</label>
			<select id="pageSizeSelect" class="form-select w-auto" [(ngModel)]="pageSize" (ngModelChange)="onPageSizeChange($event)">
				<option *ngFor="let size of [3, 6, 9, 12]" [value]="size">{{ size }}</option>
			</select>
		</div>
		<div *ngIf="loading" class="text-center my-4">
			<div class="spinner-border text-primary" role="status">
				<span class="visually-hidden">Cargando...</span>
			</div>
		</div>
		<div class="row mt-2" *ngIf="!loading">
			<div class="col-md-4 mb-3" *ngFor="let building of buildings">
				<app-building-card [building]="building"></app-building-card>
			</div>
			<div *ngIf="buildings.length === 0" class="text-center text-muted py-4">
				No se encontraron edificios.
			</div>
		</div>
		<nav *ngIf="pages.length > 1" class="mt-4">
			<ul class="pagination justify-content-center">
				<li class="page-item" [class.disabled]="page === 1">
					<button class="page-link" (click)="onPageChange(page - 1)">Anterior</button>
				</li>
				<li class="page-item" *ngFor="let p of pages" [class.active]="p === page">
					<button class="page-link" (click)="onPageChange(p)">{{ p }}</button>
				</li>
				<li class="page-item" [class.disabled]="page === pages.length">
					<button class="page-link" (click)="onPageChange(page + 1)">Siguiente</button>
				</li>
			</ul>
		</nav>
